name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTEST_ADDOPTS: --tb=no --show-capture=no

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'
          architecture: x64
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.29'
          enable-cache: false
      - name: Verify uv version
        run: |
          uv --version
          python -c 'import subprocess; assert subprocess.check_output(["uv", "--version"], text=True).split()[1] == "0.11.29"'
      - name: Sync locked dependencies
        run: uv sync --locked --python 3.12
      - name: Verify project Python version
        run: uv run --locked python -c 'import sys; assert sys.version_info[:3] == (3, 12, 13); print(sys.version.split()[0])'
      - name: Check quality
        run: make check
      - name: Build package
        run: make build
      - name: Verify dependency files unchanged
        run: git diff --exit-code -- pyproject.toml uv.lock

  postgres-integration:
    name: PostgreSQL Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.13'
          architecture: x64
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.29'
          enable-cache: false
      - name: Verify uv version
        run: |
          uv --version
          python -c 'import subprocess; assert subprocess.check_output(["uv", "--version"], text=True).split()[1] == "0.11.29"'
      - name: Sync locked dependencies
        run: uv sync --locked --python 3.12
      - name: Verify project Python version
        run: uv run --locked python -c 'import sys; assert sys.version_info[:3] == (3, 12, 13); print(sys.version.split()[0])'
      - name: Verify runner prerequisites
        run: |
          command -v bash make docker ss sha256sum
          bash --version
          make --version
          docker --version
          docker compose version
          compose_version="$(docker compose version --short)"
          [[ "$compose_version" == 2.* || "$compose_version" == v2.* ]]
          docker info --format '{{.ServerVersion}}'
      - name: Generate ephemeral configuration once
        id: setup
        run: |
          ci_namespace="ci$(printf '%s' "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}" | sha256sum | cut -c1-18)"
          [[ "$ci_namespace" =~ ^ci[a-f0-9]{18}$ ]]
          uv run --locked python scripts/database.py setup --namespace "$ci_namespace" --dev-port 55432 --test-port 55433
      - name: Verify configuration file metadata
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import stat
          import subprocess

          for name in (".env.dev.local", ".env.test.local"):
              metadata = Path(name).lstat()
              assert stat.S_ISREG(metadata.st_mode), "Configuration must be a regular non-symlink file"
              assert metadata.st_uid == os.getuid(), "Configuration must be owned by the runner user"
              assert stat.S_IMODE(metadata.st_mode) == 0o600, "Configuration must have mode 0600"
              subprocess.run(["git", "check-ignore", "-q", name], check=True)
          print("Both configuration files are ignored, owner-controlled regular files with mode 0600")
          PY
      - name: Classify bootstrap bind option without values
        run: |
          uv run --locked python - <<'PY'
          import contextlib
          import copy
          import importlib.util
          import io
          import json
          from pathlib import Path
          import sys

          # Public candidate names/types/enums from compose-go v2.7.1.
          CANDIDATES = {
              "create_host_path": (
                  (True, "PITLAB-R3 candidate=CREATE_HOST_PATH value-class=BOOL_TRUE comparison=SCHEMA_MATCH_EXCEPT_CANDIDATE"),
                  (False, "PITLAB-R3 candidate=CREATE_HOST_PATH value-class=BOOL_FALSE comparison=SCHEMA_MATCH_EXCEPT_CANDIDATE"),
              ),
              "propagation": (
                  ("rprivate", "PITLAB-R3 candidate=PROPAGATION value-class=RPRIVATE comparison=SCHEMA_MATCH_EXCEPT_CANDIDATE"),
                  ("private", "PITLAB-R3 candidate=PROPAGATION value-class=PRIVATE comparison=SCHEMA_MATCH_EXCEPT_CANDIDATE"),
                  ("rshared", "PITLAB-R3 candidate=PROPAGATION value-class=RSHARED comparison=SCHEMA_MATCH_EXCEPT_CANDIDATE"),
                  ("shared", "PITLAB-R3 candidate=PROPAGATION value-class=SHARED comparison=SCHEMA_MATCH_EXCEPT_CANDIDATE"),
                  ("rslave", "PITLAB-R3 candidate=PROPAGATION value-class=RSLAVE comparison=SCHEMA_MATCH_EXCEPT_CANDIDATE"),
                  ("slave", "PITLAB-R3 candidate=PROPAGATION value-class=SLAVE comparison=SCHEMA_MATCH_EXCEPT_CANDIDATE"),
              ),
              "selinux": (
                  ("z", "PITLAB-R3 candidate=SELINUX value-class=SHARED_LABEL comparison=SCHEMA_MATCH_EXCEPT_CANDIDATE"),
                  ("Z", "PITLAB-R3 candidate=SELINUX value-class=PRIVATE_LABEL comparison=SCHEMA_MATCH_EXCEPT_CANDIDATE"),
              ),
              "recursive": (
                  ("enabled", "PITLAB-R3 candidate=RECURSIVE value-class=ENABLED comparison=SCHEMA_MATCH_EXCEPT_CANDIDATE"),
                  ("disabled", "PITLAB-R3 candidate=RECURSIVE value-class=DISABLED comparison=SCHEMA_MATCH_EXCEPT_CANDIDATE"),
                  ("writable", "PITLAB-R3 candidate=RECURSIVE value-class=WRITABLE comparison=SCHEMA_MATCH_EXCEPT_CANDIDATE"),
                  ("readonly", "PITLAB-R3 candidate=RECURSIVE value-class=READONLY comparison=SCHEMA_MATCH_EXCEPT_CANDIDATE"),
              ),
          }
          UNEXPECTED = "PITLAB-R3 status=UNEXPECTED_SHAPE details=redacted"
          ADDITIONAL = "PITLAB-R3 status=ADDITIONAL_DIFFERENCES details=redacted"
          UNKNOWN = "PITLAB-R3 status=UNRECOGNIZED_FIELD details=redacted"
          OUT_OF_POLICY = "PITLAB-R3 status=OUT_OF_POLICY details=redacted"
          INDETERMINATE = "PITLAB-R3 status=INDETERMINATE details=redacted"
          OUTPUTS = frozenset(
              [UNEXPECTED, ADDITIONAL, UNKNOWN, OUT_OF_POLICY, INDETERMINATE]
              + [line for choices in CANDIDATES.values() for _, line in choices]
          )

          def exact_equal(actual, expected):
              if type(actual) is not type(expected):
                  return False
              if type(expected) is dict:
                  return set(actual) == set(expected) and all(
                      exact_equal(actual[key], expected[key]) for key in expected
                  )
              if type(expected) is list:
                  return len(actual) == len(expected) and all(
                      exact_equal(a, e) for a, e in zip(actual, expected)
                  )
              if type(expected) not in (str, int, float, bool, type(None)):
                  raise ValueError("redacted")
              return actual == expected

          def classify(actual, expected):
              if type(actual) is not dict or type(expected) is not dict:
                  return UNEXPECTED, 1
              try:
                  approved = expected["services"]["postgres_test"]["volumes"][1]["bind"]
                  bind = actual["services"]["postgres_test"]["volumes"][1]["bind"]
              except (KeyError, IndexError, TypeError):
                  return UNEXPECTED, 1
              if type(approved) is not dict or approved != {} or type(bind) is not dict or len(bind) != 1:
                  return UNEXPECTED, 1
              remainder = copy.deepcopy(actual)
              remainder["services"]["postgres_test"]["volumes"][1]["bind"] = {}
              if not exact_equal(remainder, expected):
                  return ADDITIONAL, 1
              key = next(iter(bind))
              if key not in CANDIDATES:
                  return UNKNOWN, 1
              value = bind[key]
              for literal, line in CANDIDATES[key]:
                  if type(value) is type(literal) and value == literal:
                      return line, 0
              return OUT_OF_POLICY, 1

          def safe_probe(resolve):
              try:
                  with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
                      line, status = classify(*resolve())
                      if line not in OUTPUTS or type(status) is not int or status not in (0, 1):
                          raise ValueError("redacted")
                  return line, status
              except BaseException:
                  return INDETERMINATE, 1

          def resolve():
              spec = importlib.util.spec_from_file_location("pitlab_ci_semantics", Path.cwd() / "scripts/database.py")
              helper = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(helper)
              config = helper.load_config("test", helper.ROOT)
              environ = helper.child_env(config)
              actual = json.loads(helper.run(
                  [*helper.compose_args(config, helper.ROOT), "config", "--format", "json"], environ
              ))
              return actual, helper.expected_model(config, helper.ROOT)

          line, status = safe_probe(resolve)
          print(line)
          sys.exit(status)
          PY
      - name: Preflight Test PostgreSQL
        run: uv run --locked python scripts/database.py preflight test
      - name: Start guarded Test PostgreSQL
        run: uv run --locked python scripts/database.py up test
      - name: Probe guarded Test PostgreSQL
        run: uv run --locked python scripts/database.py probe test
      - name: Run fast and real integration tests
        run: make test-all
      - name: Destroy guarded Test resources
        if: ${{ always() && steps.setup.outcome == 'success' }}
        timeout-minutes: 5
        run: uv run --locked python scripts/database.py destroy-test
