[project]
name = "pit-research-lab"
version = "0.1.0"
description = "A foundation for point-in-time research and experimentation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
pitlab = "pit_research_lab.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/pit_research_lab"]
